name: Sync stock Zendrop

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Produits vérifiés par exécution"
        default: "3000"
  schedule:
    - cron: "0 6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchroniser la disponibilité
        run: node scripts/sync-stock.mjs
        env:
          ZENDROP_API_KEY: ${{ secrets.ZENDROP_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://uzzuxqhoouyfhpqjtpht.supabase.co
          BATCH: ${{ inputs.batch || '3000' }}
